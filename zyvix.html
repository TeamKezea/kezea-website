<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zyvix | KEZEA Esports</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="player.css">
</head>
<body>
<main class="page">

  <div class="topbar">
    <a class="brand" href="index.html#hero">
      <img src="logo.png" alt="KEZEA Logo">
      <div>KEZEA<small>ESPORTS</small></div>
    </a>
    <a class="back" href="index.html#roster">← BACK TO ROSTER</a>
  </div>

  <section class="profile">

    <div class="visual">
      <div class="number">01</div>
      <div class="photo">
        <img src="Zyvix.png" alt="Zyvix">
      </div>
    </div>

    <div class="content">
      <div class="kicker">KEZEA ESPORTS • PLAYER PROFILE</div>
      <h1 class="name">ZYVIX</h1>
      <div class="role">CAPTAIN</div>
      <div class="rule"></div>

      <div class="info-card">

        <div class="card-title">PLAYER INFORMATION</div>

        <div class="info-list">
          <div class="info-line">
            <span class="label">REGION</span>
            <span class="value">EUROPE</span>
          </div>

          <div class="info-line">
            <span class="label">JOINED KEZEA</span>
            <span class="value">2025</span>
          </div>

          <div class="info-line">
            <span class="label">CAREER SINCE</span>
            <span class="value">2026</span>
          </div>

          <div class="info-line">
            <span class="label">STATUS</span>
            <span class="value gold">ACTIVE</span>
          </div>

          <div class="info-line">
            <span class="label">PREVIOUS TEAMS</span>
            <span class="value">NONE</span>
          </div>

          <div class="info-line">
            <span class="label">ACHIEVEMENTS</span>
            <span class="value">SOON</span>
          </div>
        </div>

        <div class="career-box">
          <div class="career-label">MAJOR APPEARANCE</div>

          <div class="event">
            <div class="event-name">RLCS 2026 EUROPE OPEN 2</div>
            <div class="result">TOP 1033 / 1,321</div>
          </div>
        </div>

      </div>

      <div class="actions">
        <a class="social" href="https://linktr.ee/zyvixrl" target="_blank" rel="noopener noreferrer">VIEW SOCIALS ↗</a>
      </div>

    </div>

  </section>

</main>
</body>
</html>
