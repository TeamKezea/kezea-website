<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Real Vexy | KEZEA Esports</title>

    <meta
        name="description"
        content="Real Vexy - KEZEA Esports Rocket League player."
    >

    <link rel="stylesheet" href="style.css">

    <link
        rel="icon"
        type="image/png"
        href="logo.png"
    >

</head>


<body class="player-body">


    <!-- BACK TO TEAM -->

    <a
        href="index.html"
        class="back-btn"
    >
        ← Back to Team
    </a>


    <!-- PLAYER PAGE -->

    <main class="player-page">

        <div class="player-profile">


            <!-- PLAYER IMAGE -->

            <img
                src="logo.png"
                alt="Real Vexy"
                class="player-image"
            >


            <!-- NAME -->

            <h1>
                Real Vexy
            </h1>


            <!-- ROLE -->

            <h3>
                PLAYER
            </h3>


            <!-- STATS -->

            <div class="player-info">


                <div>

                    <span class="stat-icon">
                        🏆
                    </span>

                    <span>
                        Wins
                    </span>

                    <b>
                        5
                    </b>

                </div>


                <div>

                    <span class="stat-icon">
                        🎯
                    </span>

                    <span>
                        Goals
                    </span>

                    <b>
                        45
                    </b>

                </div>


                <div>

                    <span class="stat-icon">
                        ⭐
                    </span>

                    <span>
                        MVP
                    </span>

                    <b>
                        3
                    </b>

                </div>


            </div>


            <!-- BIO -->

            <p>

                KEZEA player focused on improvement,
                teamwork and victory.

            </p>


            <!-- ROLE LABEL -->

            <div class="player-role">

                ROCKET LEAGUE PLAYER

            </div>


        </div>

    </main>


</body>

</html>
