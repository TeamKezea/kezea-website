<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Real Vexy - KEZEA Esports Rocket League player."
    >

    <title>Real Vexy | KEZEA Esports</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body class="player-body">


    <!-- =====================================================
         BACK TO TEAM
    ====================================================== -->

    <a
        href="index.html"
        class="back-btn"
    >
        ← Back to Team
    </a>


    <!-- =====================================================
         PLAYER PAGE
    ====================================================== -->

    <main class="player-page">


        <!-- PLAYER IMAGE -->

        <img
            src="real-vexy.png"
            alt="Real Vexy"
            class="player-image"
        >


        <!-- PLAYER NAME -->

        <h1>
            Real Vexy
        </h1>


        <!-- PLAYER TITLE -->

        <h3>
            PLAYER
        </h3>


        <!-- =================================================
             PLAYER STATS
        ================================================== -->

        <div class="player-info">


            <!-- WINS -->

            <div>

                <span class="stat-icon">
                    🏆
                </span>

                <span>
                    WINS
                </span>

                <b>
                    0
                </b>

            </div>


            <!-- GAME -->

            <div>

                <span class="stat-icon">
                    🎮
                </span>

                <span>
                    GAME
                </span>

                <b>
                    RL
                </b>

            </div>


            <!-- TEAM -->

            <div>

                <span class="stat-icon">
                    👥
                </span>

                <span>
                    TEAM
                </span>

                <b>
                    KEZ
                </b>

            </div>


        </div>


        <!-- =================================================
             PLAYER DESCRIPTION
        ================================================== -->

        <p>

            KEZEA Esports player focused on teamwork,
            development and competing at a higher level
            in Rocket League.

        </p>


        <!-- =================================================
             PLAYER ROLE
        ================================================== -->

        <span class="player-role">
            KEZEA PLAYER
        </span>


        <!-- =================================================
             SOCIAL LINKS
        ================================================== -->

        <div class="player-socials">

            <span class="social-btn disabled">
                🔗 ALL LINKS — SOON
            </span>

        </div>


    </main>


</body>

</html>
