<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Vexy | KEZEA Esports</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="player.css">
</head>
<body>

<main class="player-page">

    <div class="topbar">
        <a href="index.html#hero" class="brand">
            <img src="logo.png" alt="KEZEA Logo">
            <div>
                KEZEA
                <small>ESPORTS</small>
            </div>
        </a>

        <a href="index.html#roster" class="back">
            ← BACK TO ROSTER
        </a>
    </div>


    <section class="profile">

        <div class="visual">
            <div class="number">03</div>

            <div class="avatar">
                <img src="real-vexy.png" alt="Real Vexy">
            </div>
        </div>


        <div class="content">

            <div class="kicker">
                KEZEA ESPORTS • PLAYER PROFILE
            </div>

            <h1 class="name">
                REAL VEXY
            </h1>

            <div class="role">
                PLAYER
            </div>

            <div class="divider"></div>


            <div class="career-grid">

                <div class="career-item">
                    <div class="label">REGION</div>
                    <div class="value">EUROPE</div>
                </div>

                <div class="career-item">
                    <div class="label">JOINED KEZEA</div>
                    <div class="value">2025</div>
                </div>

                <div class="career-item">
                    <div class="label">CAREER SINCE</div>
                    <div class="value">2026</div>
                </div>

                <div class="career-item">
                    <div class="label">PREVIOUS TEAMS</div>
                    <div class="value muted">NONE</div>
                </div>

                <div class="career-item">
                    <div class="label">ACHIEVEMENTS</div>
                    <div class="value muted">SOON</div>
                </div>

                <div class="career-item">
                    <div class="label">STATUS</div>
                    <div class="value gold">ACTIVE</div>
                </div>

            </div>


            <div class="highlight">

                <div class="label">
                    MAJOR APPEARANCE
                </div>

                <div class="value">
                    RLCS 2026 EUROPE OPEN 2
                </div>

                <div class="result">
                    TOP 1033 / 1,321
                </div>

            </div>


            <div class="actions">
                <span class="social disabled">SOCIALS — SOON</span>
            </div>

        </div>

    </section>

</main>

</body>
</html>
