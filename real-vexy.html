<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Real Vexy | KEZEA Esports</title>

    <meta
        name="description"
        content="Real Vexy - KEZEA Esports Rocket League player."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="real-vexy.png"
    >

</head>


<body>

    <!-- BACK TO TEAM -->

    <a
        href="index.html"
        class="back-btn"
    >
        ← Back to Team
    </a>


    <!-- PLAYER PAGE -->

    <main class="player-page">


        <!-- PLAYER IMAGE -->

        <img
            src="real-vexy.png"
            alt="Real Vexy"
            class="player-image"
        >


        <!-- PLAYER NAME -->

        <h1>
            Real Vexy
        </h1>


        <!-- PLAYER ROLE -->

        <h3>
            PLAYER
        </h3>


        <!-- PLAYER STATS -->

        <div class="player-info">


            <div>

                <span class="stat-icon">
                    🏆
                </span>

                <span>
                    WINS
                </span>

                <b>
                    0
                </b>

            </div>


            <div>

                <span class="stat-icon">
                    🎮
                </span>

                <span>
                    GAME
                </span>

                <b>
                    RL
                </b>

            </div>


            <div>

                <span class="stat-icon">
                    👥
                </span>

                <span>
                    TEAM
                </span>

                <b>
                    KEZ
                </b>

            </div>


        </div>


        <!-- PLAYER DESCRIPTION -->

        <p>

            KEZEA Esports player focused on teamwork,
            development and competing at a higher level
            in Rocket League.

        </p>


        <!-- PLAYER ROLE BADGE -->

        <span class="player-role">
            KEZEA PLAYER
        </span>


        <!-- SOCIAL LINKS -->

        <div class="player-socials">

            <span class="social-btn disabled">
                🔗 ALL LINKS — SOON
            </span>

        </div>


    </main>


</body>

</html>
