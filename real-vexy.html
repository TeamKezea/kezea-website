<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Vexy | KEZEA Esports</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="player.css">
</head>
<body>
<main class="page">

  <div class="topbar">
    <a class="brand" href="index.html#hero">
      <img src="logo.png" alt="KEZEA Logo">
      <div>KEZEA<small>ESPORTS</small></div>
    </a>
    <a class="back" href="index.html#roster">← BACK TO ROSTER</a>
  </div>

  <section class="profile">

    <div class="visual">
      <div class="number">03</div>
      <div class="photo">
        <img src="real-vexy.png" alt="Real Vexy">
      </div>
    </div>

    <div class="content">
      <div class="kicker">KEZEA ESPORTS • PLAYER PROFILE</div>
      <h1 class="name">REAL VEXY</h1>
      <div class="role">PLAYER</div>
      <div class="rule"></div>

      <div class="info-row">
        <div class="info">
          <div class="label">REGION</div>
          <div class="value">EUROPE</div>
        </div>
        <div class="info">
          <div class="label">JOINED KEZEA</div>
          <div class="value">2025</div>
        </div>
        <div class="info">
          <div class="label">CAREER SINCE</div>
          <div class="value">2026</div>
        </div>
        <div class="info">
          <div class="label">STATUS</div>
          <div class="value gold">ACTIVE</div>
        </div>
      </div>

      <div class="career">
        <div class="career-title">MAJOR APPEARANCE</div>
        <div class="event">
          <div class="event-name">RLCS 2026 EUROPE OPEN 2</div>
          <div class="result">TOP 1033 / 1,321</div>
        </div>
      </div>

      <div class="footer-row">
        <div class="previous">PREVIOUS TEAMS — NONE • ACHIEVEMENTS — SOON</div>
        <span class="social disabled">SOCIALS — SOON</span>
      </div>

    </div>

  </section>

</html>
