<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zyvix | KEZEA Esports</title>

    <meta
        name="description"
        content="Zyvix - Captain of KEZEA Esports and competitive Rocket League player."
    >

    <link
        rel="stylesheet"
        href="style.css?v=2"
    >

    <link
        rel="icon"
        type="image/png"
        href="Zyvix.html"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="player-body">


    <!-- BACK BUTTON -->

    <a
        href="index.html"
        class="back-btn"
    >
        ← Back to Team
    </a>



    <!-- PLAYER PAGE -->

    <main class="player-page">

        <div class="player-profile">


            <!-- PLAYER LOGO -->

            <img
                src="Zyvix.png"
                alt="Zyvix"
                class="player-image"
            >


            <!-- NAME -->

            <h1>
                Zyvix
            </h1>


            <!-- ROLE -->

            <h3>
                CAPTAIN
            </h3>



            <!-- STATS -->

            <div class="player-info">


                <div>

                    <span class="stat-icon">
                        🏆
                    </span>

                    <span>
                        Wins
                    </span>

                    <b>
                        12
                    </b>

                </div>


                <div>

                    <span class="stat-icon">
                        🎯
                    </span>

                    <span>
                        Goals
                    </span>

                    <b>
                        85
                    </b>

                </div>


                <div>

                    <span class="stat-icon">
                        ⭐
                    </span>

                    <span>
                        MVP
                    </span>

                    <b>
                        8
                    </b>

                </div>


            </div>



            <!-- BIO -->

            <p>
                Zyvix is the captain of KEZEA Esports.
                Leading the team with teamwork,
                strategy and competitive Rocket League skills.
            </p>



            <!-- ROLE LABEL -->

            <div class="player-role">
                ROCKET LEAGUE PLAYER
            </div>


        </div>

    </main>


</body>

</html>
