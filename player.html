<!DOCTYPE html>

<html lang="en">

<head>

```
<!-- =========================
     BASIC META
========================== -->

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Zyvix | KEZEA Esports</title>

<meta
    name="description"
    content="Zyvix - Captain of KEZEA Esports and competitive Rocket League player."
>

<meta
    name="author"
    content="KEZEA Esports"
>

<!-- =========================
     STYLES
========================== -->

<link rel="stylesheet" href="style.css">

<!-- =========================
     FAVICON
========================== -->

<link
    rel="icon"
    type="image/png"
    href="logo.png"
>
```

</head>

<body>

```
<!-- =========================
     BACK BUTTON
========================== -->

<a
    href="index.html"
    class="back-btn"
>
    ← Back to Team
</a>



<!-- =========================
     PLAYER PROFILE
========================== -->

<main>

    <div class="player-profile">


        <!-- PLAYER IMAGE -->

        <img
            src="logo.png"
            alt="Zyvix"
        >


        <!-- PLAYER NAME -->

        <h1>
            Zyvix
        </h1>


        <!-- PLAYER ROLE -->

        <h3>
            CAPTAIN
        </h3>



        <!-- =========================
             PLAYER STATS
        ========================== -->

        <div class="player-info">


            <!-- WINS -->

            <div>

                🏆

                <span>
                    Wins
                </span>

                <b>
                    12
                </b>

            </div>



            <!-- GOALS -->

            <div>

                🎯

                <span>
                    Goals
                </span>

                <b>
                    85
                </b>

            </div>



            <!-- MVP -->

            <div>

                ⭐

                <span>
                    MVP
                </span>

                <b>
                    8
                </b>

            </div>


        </div>



        <!-- =========================
             PLAYER BIO
        ========================== -->

        <p>

            Zyvix is the captain of KEZEA Esports.
            Leading the team with teamwork,
            strategy and competitive Rocket League skills.

        </p>



        <!-- =========================
             PLAYER ROLE LABEL
        ========================== -->

        <div class="player-role">

            ROCKET LEAGUE PLAYER

        </div>


    </div>

</main>
```

</body>

</html>
